name: Build develop image

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  get-data:
    runs-on: ubuntu-latest
    outputs:
      releaseImg: ${{ steps.get_release_img.outputs.release }}
    steps:
      -
        id: get_release_img
        uses: pozetronic/github-action-get-latest-release@master
        with:
          repository: ${{ github.repository }}
  build-develop:
    needs: get-data
    uses: $/.github/workflows/build_and_publish.yml
    with:
      appGitRefs: develop
      appAddSha: true
      imgBuild: ${{ needs.get-data.outputs.releaseImg }}
      regName: ${{ vars.REGISTRY_URL }}
      regLogin: ${{ vars.REGISTRY_LOGIN }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
