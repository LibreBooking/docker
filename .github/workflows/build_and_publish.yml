name: Build and publish on workflow call

on:
  workflow_call:
    inputs:
      appGitRefs:
        required: false
        type: string
      appAddSha:
        required: false
        type: boolean
        default: false
      imgBuild:
        required: false
        type: string
      regName:
        required: true
        type: string
      regLogin:
        required: true
        type: string
    secrets:
      REGISTRY_TOKEN:
        description: docker registry access token
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.release }}
      tagSuffix: ${{ steps.get_tag_suffix.outputs.release }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      -
        name: Get the docker image tag
        id: get_tag
        run: |
          appTag=$(basename ${{ inputs.appGitRefs }} | sed -e "s/^[vV]//")
          echo "release=$appTag" >> $GITHUB_OUTPUT
      -
        name: Get the docker image tag suffix
        id: get_tag_suffix
        run: |
          if [ "${{ inputs.imgBuild }}" == "" ]; then
            echo "release=$(gh release view -R ${{ github.repository }} --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
          else
            echo "release=${{ inputs.imgBuild }}" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ${{ inputs.regLogin }}/librebooking
      meta-tags: |
        type=raw,enable=${{ needs.prepare.outputs.appTag == '' }},value=nightly
        type=raw,enable=${{ needs.prepare.outputs.appTag == '' }},value=nightly,suffix=-${{ needs.prepare.outputs.tagSuffix }}
        type=raw,enable=${{ needs.prepare.outputs.appTag == '' }},value=develop
        type=raw,enable=${{ needs.prepare.outputs.appTag == '' }},value=develop,suffix=-${{ needs.prepare.outputs.tagSuffix }}
        type=raw,enable=${{ needs.prepare.outputs.appTag != '' }},value=${{ needs.prepare.outputs.tag }}
        type=raw,enable=${{ needs.prepare.outputs.appTag != '' }},value=${{ needs.prepare.outputs.tag }},suffix=-${{ needs.prepare.outputs.tagSuffix }}
      build-args: |
        APP_GH_REF=${{ inputs.appGitRefs }}
        APP_GH_ADD_SHA=${{ inputs.appAddSha }}
    secrets:
      registry-auths: |
        - registry: ${{ inputs.regName }}
          username: ${{ inputs.regLogin }}
          password: ${{ secrets.REGISTRY_TOKEN }}
