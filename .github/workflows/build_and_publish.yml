name: Build and publish on workflow call

on:
  workflow_call:
    inputs:
      appGitRefs:
        required: false
        type: string
      appAddSha:
        required: false
        type: boolean
        default: false
      imgBuild:
        required: false
        type: string
      regName:
        required: true
        type: string
      regLogin:
        required: true
        type: string
    secrets:
      REGISTRY_TOKEN:
        description: docker registry access token
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      appTag: ${{ steps.set_app_tag.outputs.appTag }}
      imgTag: ${{ steps.set_img_tag.outputs.imgTag }}
      latest: ${{ steps.set_latest.output.latest }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      -
        id: get_latest_tags
        name: Check latest releases for librebooking/librebooking and librebooking/docker
        run: |
          latestAppTag=$(gh release view -R librebooking/librebooking --json tagName -q .tagName)
          echo "latestAppTag=${latestAppTag#[vV]}" >> $GITHUB_OUTPUT
          latestImgTag=$(gh release view -R ${{ github.repository }} --json tagName -q .tagName)
          echo "latestImgTag=${latestImgTag#[vV]}" >> $GITHUB_OUTPUT
      -
        id: set_app_tag
        name: Set the application tag
        run: |
          appTag=$(basename ${{ inputs.appGitRefs }})
          echo "appTag=${appTag#[vV]}" >> $GITHUB_OUTPUT

      -
        id: set_img_tag
        name: Set the image tag
        run: |
          if [ -z "${{ inputs.imgBuild }}" ]; then
            imgTag=${{ steps.get_latest_tags.outputs.latestImgTag }}
          else
            imgTag=${{ inputs.imgBuild }}
          fi
          echo "imgTag=${imgTag#[vV]}" >> "$GITHUB_OUTPUT"
      -
        id: set_latest
        name: Check if this is the latest stable
        run: |
          if [ "${{ steps.set_app_tag.outputs.appTag }}" == "${{ steps.get_latest_tags.outputs.latestAppTag}}" ] \
          && [ "${{ steps.set_img_tag.outputs.imgTag }}" == "${{ steps.get_latest_tags.outputs.latestImgTag}}" ] ; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ${{ inputs.regLogin }}/librebooking
      meta-tags: |
        type=raw,enable=${{ needs.prepare.outputs.appTag == '' }},value=nightly
        type=raw,enable=${{ needs.prepare.outputs.appTag == '' }},value=nightly,suffix=-${{ needs.prepare.outputs.imgTag }}
        type=raw,enable=${{ needs.prepare.outputs.appTag == '' }},value=develop
        type=raw,enable=${{ needs.prepare.outputs.appTag == '' }},value=develop,suffix=-${{ needs.prepare.outputs.imgTag }}
        type=raw,enable=${{ needs.prepare.outputs.appTag != '' }},value=${{ needs.prepare.outputs.appTag }}
        type=raw,enable=${{ needs.prepare.outputs.appTag != '' }},value=${{ needs.prepare.outputs.appTag }},suffix=-${{ needs.prepare.outputs.imgTag }}
        type=raw,enable=${{ needs.prepare.outputs.latest == true }},value=latest
      build-args: |
        APP_GH_REF=${{ inputs.appGitRefs }}
        APP_GH_ADD_SHA=${{ inputs.appAddSha }}
    secrets:
      registry-auths: |
        - registry: ${{ inputs.regName }}
          username: ${{ inputs.regLogin }}
          password: ${{ secrets.REGISTRY_TOKEN }}
